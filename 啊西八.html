<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>김태영의 iPhone · 完整修正版</title>
<style>
:root{--bg:#17191d;--panel:#24262b;--panel2:#303238;--line:#45474d;--muted:#a4a6ad;--text:#f7f7f8;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--yellow:#ffd60a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e0f11;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
#stage{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#292b30 0,#111214 68%);padding:0}
#phone{position:relative;width:min(100vw,calc(100dvh * 9 / 19.5));height:min(100dvh,calc(100vw * 19.5 / 9));aspect-ratio:9/19.5;background:#222;border:1px solid #555;border-radius:38px;overflow:hidden;box-shadow:0 20px 80px #000b;isolation:isolate}
@media(max-width:520px){#stage{background:#17191d}#phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
#wallpaper{position:absolute;inset:0;background:#303238}
#statusbar{position:absolute;z-index:30;top:0;left:0;right:0;height:32px;padding:8px 22px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:650;pointer-events:none}
.statusright{display:flex;gap:5px;align-items:center}
#dynamic-island{position:absolute;z-index:31;top:7px;left:50%;transform:translateX(-50%);width:86px;height:23px;border-radius:20px;background:#050505}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
#lockscreen{z-index:5;background:#303238}
#locktime{position:absolute;top:16%;width:100%;text-align:center;font-size:76px;letter-spacing:-3px;font-weight:250}
#lockdate{position:absolute;top:14%;width:100%;text-align:center;font-size:16px}
#lockhint{position:absolute;bottom:12%;width:100%;text-align:center;color:#ddd;font-size:13px}
#locknotifs{position:absolute;top:43%;left:14px;right:14px;display:grid;gap:8px}
.notif{background:#ffffffd9;color:#171717;border-radius:15px;padding:11px 13px;font-size:12px;backdrop-filter:blur(20px)}
.notif b{display:block;font-size:13px;margin-bottom:3px}
#lockbottom{position:absolute;bottom:28px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center}
.lockcircle{width:42px;height:42px;border-radius:50%;background:#3339;border:1px solid #ffffff55;display:grid;place-items:center;font-size:18px}
#unlock{position:absolute;inset:0;z-index:9;background:#17191df2;display:none;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(25px)}
#unlock.show{display:flex}
#unlock h2{font-size:18px;font-weight:550;margin:0 0 24px}
#dots{display:flex;gap:14px;margin-bottom:26px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid #fff}
.dot.filled{background:#fff}
#keypad{width:230px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{height:58px;border:0;border-radius:50%;background:#ffffff20;color:white;font-size:25px;font-weight:300}
.key small{display:block;font-size:8px;letter-spacing:1px}
.key:active{background:#ffffff55}
#home{z-index:4;background:#303238;padding:58px 17px 30px}
#homepages{height:calc(100% - 100px);position:relative}
.homepage{display:none;height:100%;grid-template-columns:repeat(4,1fr);grid-auto-rows:88px;align-content:start;gap:3px 5px}
.homepage.active{display:grid}
.appicon{border:0;background:transparent;color:white;display:flex;align-items:center;flex-direction:column;gap:5px;padding:0;min-width:0}
.iconbox{width:53px;height:53px;border-radius:14px;display:grid;place-items:center;font-size:27px;font-weight:650;box-shadow:0 2px 5px #0003;position:relative;overflow:hidden;flex:none}.iconbox svg{width:100%;height:100%;display:block}.iconbox>img{width:100%;height:100%;object-fit:cover;display:block}.iconbox .wordmark{font-size:15px;font-weight:800;letter-spacing:-.7px}.iconbox.icon-calendar{font-size:10px}
.appicon span:last-child{font-size:10px;text-shadow:0 1px 3px #000;font-weight:450;white-space:nowrap}
.icon-kakao{background:#fee500;color:#291e00}.icon-ig{background:radial-gradient(circle at 30% 105%,#ffd776 0,#f56040 35%,#c13584 62%,#833ab4 85%,#405de6 100%);color:white}
.icon-x{background:#080808;color:white}.icon-bubble{background:#8ac9ff;color:#124d83}.icon-berriz{background:#fff;color:#e94d75}.icon-yt{background:#fff;color:#f00}.icon-camera{background:linear-gradient(#555,#111);color:#fff}.icon-photos{background:linear-gradient(135deg,#fff,#ddd);color:#e65a94}.icon-calendar{background:#fff;color:#222;font-size:11px}.icon-melon{background:#00c875;color:#fff}.icon-maps{background:#fff;color:#37a66b}.icon-weather{background:linear-gradient(#52b7fa,#2862a7);color:#fff}.icon-mail{background:linear-gradient(#80c7ff,#1676dc);color:white}.icon-game{background:#26272d;color:#a5e7c7}.icon-wallet{background:#111;color:#fff;border:1px solid #aaa}.icon-clock{background:#fff;color:#222}.icon-translate{background:#fff;color:#2877d6}.icon-food{background:linear-gradient(135deg,#ff9b65,#f05b36);color:#fff}.icon-taxi{background:#f6ce36;color:#222}.icon-health{background:#fff;color:#ff375f}.icon-notes{background:#fff;color:#333}.icon-phone{background:#36c65b;color:white}.icon-msg{background:#38cf65;color:white}.icon-settings{background:linear-gradient(#aaa,#666);color:#fff}.icon-calc{background:#ff9f0a;color:white}
#dock{position:absolute;bottom:15px;left:13px;right:13px;height:82px;border-radius:25px;background:#ffffff35;backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px}
#dock .appicon span:last-child{display:none}
#pagedots{position:absolute;bottom:107px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.pagedot{width:6px;height:6px;border-radius:50%;background:#ffffff70}.pagedot.on{background:#fff}
#appview{z-index:10;background:#f4f4f6;color:#171719;display:none}
#appview.active{display:block}
.appheader{height:62px;padding:29px 15px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;background:#f8f8fa;position:relative;z-index:2}
.appheader h2{font-size:17px;margin:0;font-weight:700}
.appheader button{border:0;background:transparent;color:#087cff;font-size:14px;padding:4px}
.appbody{height:calc(100% - 62px);overflow:auto;padding:14px 14px 30px;background:#f4f4f6;color:#171719}
.appbody.dark{background:#080808;color:#f5f5f5}
.card{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 1px 2px #0000000a}
.card.dark{background:#171719;color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:#8b8b91}.small{font-size:12px}.tiny{font-size:10px}
.pill{display:inline-block;border-radius:99px;background:#e8f2ff;color:#087cff;padding:4px 8px;font-size:11px}
.item{padding:13px 2px;border-bottom:1px solid #e5e5e8}
.item:last-child{border:0}
.action{border:0;border-radius:10px;background:#087cff;color:#fff;padding:10px 13px;font-weight:600}
.action.secondary{background:#e9e9ed;color:#222}
.action.danger{background:#ff453a}
.choice{width:100%;text-align:left;border:1px solid #ddd;background:white;color:#222;padding:12px;border-radius:12px;margin:5px 0}
#homebar{position:absolute;z-index:40;bottom:7px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:5px;background:#fff;opacity:.85;display:none}
#homebar.dark{background:#111}
#gesturelayer{position:absolute;z-index:35;bottom:0;left:0;right:0;height:20px}
#toast{position:absolute;z-index:80;bottom:40px;left:50%;transform:translateX(-50%);background:#222e;color:#fff;padding:9px 14px;border-radius:20px;font-size:12px;display:none;white-space:nowrap}
#overlay{position:absolute;inset:0;z-index:50;display:none;background:#0008;backdrop-filter:blur(12px);padding:42px 14px 20px;overflow:auto}
#overlay.show{display:block}
#overlay .sheet{background:#f4f4f6;color:#171719;border-radius:20px;padding:15px;max-height:100%;overflow:auto}
#overlay h3{margin:3px 0 12px}
#appfooter{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:4px;background:#111;z-index:4;pointer-events:none}
input[type=text]{border:1px solid #ccc;border-radius:9px;padding:10px;width:100%}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photo{aspect-ratio:1;background:linear-gradient(135deg,#777,#34363b);display:flex;align-items:end;padding:6px;color:#fff;font-size:10px;text-shadow:0 1px 4px #000}
#appbody-content{min-height:100%}
@media(min-width:700px){#phone{border-radius:42px}}

/* KakaoTalk：獨立聊天列表與一對一／群組聊天室 */
#appbody:has(.kt-wrap){padding:0!important;overflow:hidden;background:#b7c8d8}
.kt-wrap{height:100%;display:flex;flex-direction:column;background:#f7f7f7;color:#222;overflow:hidden}
.kt-top{height:52px;flex:none;background:#fee500;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:18px;font-weight:750}
.kt-top-actions{display:flex;gap:18px;font-size:20px;font-weight:400}
.kt-search{margin:11px 14px 8px;padding:10px 13px;border-radius:9px;background:#f1f1f1;color:#999;font-size:13px}
.kt-list{flex:1;overflow:auto;background:#fff}
.kt-row{width:100%;display:flex;align-items:center;gap:11px;padding:12px 14px;border:0;border-bottom:1px solid #f0f0f0;background:#fff;text-align:left;color:#222;min-height:72px}
.kt-avatar{width:48px;height:48px;border-radius:50%;flex:none;background:linear-gradient(145deg,#8b8fd7,#555da8);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;position:relative;overflow:hidden}
.kt-avatar.group{background:#d9d2c8;color:#766d62}
.kt-row-main{min-width:0;flex:1}
.kt-row-title{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:650}
.kt-row-preview{font-size:12px;color:#999;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt-row-right{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;font-size:10px;color:#aaa;padding:2px 0}
.kt-unread{width:18px;height:18px;border-radius:50%;background:#f04d42;color:white;display:grid;place-items:center;font-size:10px}
.kt-tabs{height:54px;flex:none;background:#fafafa;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;color:#888;font-size:11px}
.kt-tabs span{display:flex;flex-direction:column;align-items:center;gap:3px}.kt-tabs b{font-size:19px;font-weight:500;color:#555}
.kt-room{height:100%;display:flex;flex-direction:column;background:#b7c8d8;color:#222;overflow:hidden}
.kt-roomhead{height:49px;flex:none;background:#b7c8d8;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #a9bac9}
.kt-roomhead button{background:transparent;color:#2875a8;font-size:15px;padding:5px}
.kt-roomtitle{font-size:16px;font-weight:700;text-align:center;flex:1}
.kt-roomtools{font-size:19px;color:#536b7e;min-width:48px;text-align:right}
.kt-messages{flex:1;min-height:0;overflow:auto;padding:9px 11px 14px;scroll-behavior:smooth}
.kt-day{text-align:center;color:#fff;background:#8299aa;border-radius:14px;font-size:10px;padding:5px 12px;width:max-content;margin:13px auto 17px}
.kt-msg{display:flex;gap:7px;margin:10px 0;align-items:flex-end}
.kt-msg.mine{justify-content:flex-end}
.kt-msg-avatar{width:30px;height:30px;flex:none;border-radius:50%;background:#eeeeef;border:1px solid #dedede;position:relative;overflow:hidden;display:block;color:transparent;font-size:0}
.kt-msg-avatar::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#c7c7c7;left:50%;top:5px;transform:translateX(-50%)}
.kt-msg-avatar::after{content:"";position:absolute;width:19px;height:14px;border-radius:12px 12px 5px 5px;background:#c7c7c7;left:50%;bottom:2px;transform:translateX(-50%)}
.kt-msg-content{max-width:77%;min-width:0}
.kt-sender{font-size:10px;color:#536879;margin:0 0 4px 2px}
.kt-bubbleline{display:flex;align-items:flex-end;gap:5px}
.kt-bubble{background:#fff;border-radius:4px 13px 13px 13px;padding:9px 11px;font-size:13px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px #52697a12}
.kt-msg.mine .kt-bubble{background:#fee500;border-radius:13px 4px 13px 13px}
.kt-translation{border-top:1px solid #00000012;padding-top:5px;margin-top:5px;color:#777;font-size:11px;line-height:1.4}
.kt-time{font-size:9px;color:#60788a;white-space:nowrap;padding-bottom:2px}
.kt-compose{flex:none;background:#edf1f4;border-top:1px solid #a8b8c5;padding:8px 10px calc(10px + env(safe-area-inset-bottom));max-height:38%;overflow:auto}
.kt-compose-label{font-size:10px;color:#718391;margin:0 0 5px 2px}
.kt-reply{width:100%;text-align:left;border:0;border-radius:10px;background:#fff6bd;color:#333;padding:8px 10px;margin:4px 0;font-size:12px;line-height:1.4}
.kt-reply .kt-translation{font-size:10px;margin-top:3px;padding-top:3px}
.kt-readonly{font-size:11px;color:#718391;text-align:center;padding:13px;background:#edf1f4}


/* STARSHIP bubble：使用官方圖示與滿版白色介面 */
.icon-bubble{background:transparent!important;box-shadow:none!important;border-radius:14px!important}
.icon-bubble img{width:100%;height:100%;display:block;object-fit:cover;border-radius:14px}
#appview.bubble-mode{background:#fff;color:#111}
#appview.bubble-mode .appheader{display:none}
#appview.bubble-mode .appbody{position:absolute;inset:0;height:100%;padding:0!important;background:#fff;color:#111;overflow:hidden}
#appview.bubble-mode #appbody-content{height:100%;min-height:100%;background:#fff}
#appview.bubble-mode #appfooter{display:none}
#appview.bubble-mode #appmore{display:none}
#appview.bubble-mode #appback{display:none}
#statusbar.bubble-status{color:#111}
.bubble-home{height:100%;display:flex;flex-direction:column;background:#fff;color:#111;padding:calc(42px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));}
.bubble-home-title{font-size:19px;font-weight:750;text-align:center;padding:10px 0 18px;border-bottom:1px solid #eee;letter-spacing:-.3px}
.bubble-choice{display:flex;align-items:center;gap:13px;width:100%;padding:15px 3px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;color:#111}
.bubble-choice-avatar{width:54px;height:54px;border-radius:50%;border:2px solid #ed9849;background:#f1f1f1;display:grid;place-items:center;overflow:hidden;flex:none}
.bubble-choice-avatar img{width:100%;height:100%;object-fit:cover}
.bubble-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#aaa;font-size:22px}
.bubble-choice-main{flex:1;min-width:0}
.bubble-choice-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.bubble-choice-sub{font-size:12px;color:#999;margin-top:5px}
.bubble-unread{width:7px;height:7px;border-radius:50%;background:#ed9849}
.bubble-room{height:100%;display:flex;flex-direction:column;background:#fff;color:#111;overflow:hidden}
.bubble-room-head{height:52px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #f0f0f0;font-size:16px;font-weight:700;padding:0 48px}
.bubble-room-head button{position:absolute;left:10px;top:4px;border:0;background:transparent;color:#222;font-size:30px;line-height:40px;padding:0 8px}
.bubble-room-head .bubble-room-more{left:auto;right:12px;font-size:20px;color:#777}
.bubble-room-messages{flex:1;min-height:0;overflow:auto;padding:14px 10px 22px;background-color:#eee;background-attachment:local;}
.bubble-message{display:flex;gap:8px;align-items:flex-start;margin:0 0 22px}
.bubble-message-content{min-width:0;max-width:calc(100% - 48px);flex:1}
.bubble-avatar{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid #e99a4e;padding:2px;background:#fff;overflow:hidden;display:block;cursor:pointer}
.bubble-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.bubble-avatar .bubble-placeholder{border-radius:50%;background:#f1f1f1}
.bubble-artist-line{display:flex;align-items:center;gap:7px;margin:0 0 6px}
.bubble-artist-tag{display:inline-flex;align-items:center;justify-content:center;background:#e9954a;color:#fff;font-size:10px;letter-spacing:1px;font-weight:850;padding:4px 7px;border-radius:2px;line-height:1.1}
.bubble-artist-name{font-size:14px;font-weight:750;color:#111}
.bubble-card{background:#fff;border-radius:4px 20px 20px 20px;box-shadow:0 1px 1px #00000008;overflow:hidden;max-width:100%;border:1px solid #f5f5f5}
.bubble-korean{padding:13px 14px 12px;color:#111;font-size:16px;font-weight:550;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble-chinese{border-top:2px dashed #ededed;padding:12px 14px 13px;color:#222;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble-time{font-size:11px;color:#a4aaa2;text-align:right;margin:4px 2px 0}
.bubble-image{display:block;width:100%;max-width:260px;max-height:330px;object-fit:cover;border-radius:12px;cursor:pointer}
.bubble-static-card{background:#fff;border:1px solid #eee;border-radius:18px;padding:14px 17px;display:flex;align-items:center;gap:13px;font-size:20px;color:#111;min-height:68px}
.bubble-static-icon{width:38px;height:38px;border:2px solid #eee;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.bubble-static-note{font-size:11px;color:#aaa;margin:5px 0 0 3px}
.bubble-profile{position:relative;width:100%;height:100%;min-height:100%;background:#fff;color:#111;overflow:hidden}
.bubble-profile-close{position:absolute;z-index:3;top:calc(4.5% + env(safe-area-inset-top));left:5.5%;width:34px;height:34px;border:0;background:transparent;color:#111;font-size:34px;font-weight:300;line-height:30px;padding:0}
.bubble-profile-group{position:absolute;left:0;right:0;top:calc(60% - min(12vw, 50px));transform:none;display:flex;flex-direction:column;align-items:center;text-align:center}
.bubble-profile-avatar{width:24vw;height:24vw;max-width:100px;max-height:100px;min-width:78px;min-height:78px;border-radius:50%;border:3px solid #ed9849;padding:3px;background:#fff;overflow:hidden;display:block;cursor:pointer}
.bubble-profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.bubble-profile-name-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:1.5vh}
.bubble-profile .bubble-artist-tag{font-size:9px;padding:3px 7px;letter-spacing:1px}
.bubble-profile-name{font-size:14px;font-weight:750;line-height:1.2}
.bubble-clover{font-size:24px;line-height:1;margin-top:2.2vh}
.bubble-profile-id{margin-top:3.3vh;border:1px solid #d9d9de;border-radius:999px;padding:6px 4px;color:#555;font-size:10px;line-height:1.2;white-space:nowrap;background:#ffffffa8;width:35vw;min-width:0}
.bubble-upload-hint{font-size:9px;color:#aaa;margin-top:8px}
#bubble-image-viewer{position:absolute;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center}
#bubble-image-viewer.show{display:flex}
#bubble-image-viewer img{max-width:100%;max-height:100%;object-fit:contain}
#bubble-image-viewer button{position:absolute;top:calc(28px + env(safe-area-inset-top));left:18px;border:0;background:transparent;color:#fff;font-size:32px}


/* Phone app — iOS 26 unified layout */
#appview.phone-mode .appheader{display:none}
#appview.phone-mode .appbody{position:absolute;inset:0;height:100%;padding:0!important;background:#f5f5f7;color:#111;overflow:hidden}
#appview.phone-mode #appbody-content{height:100%;min-height:100%;background:#f5f5f7}
#appview.phone-mode #appfooter{background:#111;z-index:12}
.phone-ui{height:100%;display:flex;flex-direction:column;background:#f5f5f7;color:#111;overflow:hidden;padding-top:calc(45px + env(safe-area-inset-top));}
.phone-scroll{flex:1;min-height:0;overflow:auto;padding:12px 17px 18px;}
.phone-topline{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
.phone-title{font-size:31px;letter-spacing:-1px;font-weight:760}
.phone-topbtn{border:0;background:transparent;color:#087cff;font-size:15px;padding:5px}
.phone-search{height:37px;border-radius:11px;background:#e7e7eb;color:#8c8c92;display:flex;align-items:center;gap:8px;padding:0 11px;font-size:14px;margin:10px 0 20px}

function buildHome(){el('page0').innerHTML=APPS.slice(0,12).map(a=>makeIcon(a[0])).join('');el('page1').innerHTML=APPS.slice(12,21).map(a=>makeIcon(a[0])).join('');el('dock').innerHTML=dockIds.map(makeIcon).join('');}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));el(id).classList.add('active');el('homebar').style.display=id==='lockscreen'?'none':'block';el('homebar').classList.toggle('dark',id==='appview');}
function unlockStart(){el('unlock').classList.add('show');state.pass='';drawDots()}
function drawDots(){document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('filled',i<state.pass.length))}
function enterKey(k){if(k==='clear'){state.pass=''}else if(k==='del'){state.pass=state.pass.slice(0,-1)}else if(state.pass.length<4){state.pass+=k}
drawDots();if(state.pass.length===4){if(state.pass==='0801'){el('unlock').classList.remove('show');state.unlocked=true;showScreen('home');toast('已解鎖');save()}else{el('pass-error').textContent='密碼錯誤';setTimeout(()=>{state.pass='';drawDots();el('pass-error').textContent=''},700)}}}
function openApp(id){state.app=id;const a=APPS.find(x=>x[0]===id);el('appview').classList.remove('bubble-mode','phone-mode','berriz-mode');el('statusbar').classList.remove('bubble-status');el('apptitle').textContent=a?a[1]:id;el('appback').style.visibility='visible';showScreen('appview');renderApp(id);save()}
function closeApp(){state.app=null;el('appview').classList.remove('bubble-mode','phone-mode','berriz-mode');el('statusbar').classList.remove('bubble-status');showScreen('home')}
function header(title,body,opts={}){el('apptitle').textContent=title;el('appbody').style.padding='14px 14px 30px';el('appbody').classList.toggle('dark',!!opts.dark);el('appbody-content').innerHTML=body}
function appRow(title,sub='',right=''){return `<div class="item"><div class="row"><b>${title}</b><span class="muted small">${right}</span></div>${sub?`<div class="muted small" style="margin-top:4px">${sub}</div>`:''}</div>`}
function phoneAvatar(name){
 const initials={'성민이':'성','매니저님':'M','박세림':'世','김태영':'太','원진':'進','정모':'謨','형준':'俊','민희':'熙','우빈':'彬','未知號碼':'?'};
 return `<span class="phone-avatar">${initials[name]||name.slice(0,1)}</span>`;
}
function phoneFrame(content,tab='calls'){
 const tabs=[['calls','◷','通話'],['contacts','♙','聯絡人'],['keypad','▦','鍵盤'],['search','⌕','搜尋']];
 return `<div class="phone-ui"><div class="phone-scroll" id="phone-scroll">${content}</div><nav class="phone-nav">${tabs.map(([id,icon,label])=>`<button class="${tab===id?'active':''}" onclick="phoneTab('${id}')"><b>${icon}</b><span>${label}</span></button>`).join('')}</nav></div>`;
}
function phoneTab(tab){
 const root=el('appbody-content'); if(!root)return;
 root.innerHTML=phoneFrame(phoneContent(tab),tab);
 el('appbody').style.padding='0';
}
function phoneContent(tab){
 if(tab==='calls'){
  const recent=[...(state.calls||[]).slice().reverse().map(call=>[call.name,call.accepted?'傳入通話 · 已接聽':'未接來電',call.time,'↙']),
   ['성민이','傳入通話 · 已接聽','今天 07:12','↙'],
   ['매니저님','傳入通話 · 已接聽','昨天 21:30','↙'],
   ['未知號碼','未接來電','昨天 02:14','↙'],
   ['박세림','傳入通話 · 已接聽','11月1日','↙']
  ];
  return `<div class="phone-topline"><div class="phone-title">通話</div><button class="phone-topbtn" onclick="incomingCall()">模擬來電</button></div>
   <div class="phone-search" onclick="phoneTab('search')">⌕　搜尋</div>
   <div class="phone-section-title">常用聯絡人</div>
   <div class="phone-favs">${[['성민이','成'],['매니저님','M'],['박세림','世'],['정모형','謨']].map(([n])=>`<button class="phone-fav" onclick="phoneContact('${n}')">${phoneAvatar(n)}<span class="phone-fav-name">${n}</span></button>`).join('')}</div>
   <div class="phone-section-title">最近通話 <button class="phone-topbtn" style="float:right;font-size:13px" onclick="toast('通話紀錄僅供瀏覽')">編輯</button></div>
   <div class="phone-list">${recent.map(([n,sub,time,arrow])=>`<button class="phone-callrow" onclick="phoneContact('${n}')">${phoneAvatar(n)}<span class="phone-row-main"><span class="phone-row-name">${n}</span><span class="phone-row-sub">${sub}</span></span><span class="phone-row-time">${time}　<span style="color:#999">ⓘ</span></span></button>`).join('')}</div>
   <p class="phone-empty">僅顯示手機內的模擬通話紀錄</p>`;
 }
 if(tab==='contacts'){
  const names=['성민이','매니저님','박세림','정모형','원진형','형준형','민희형','우빈형'];
  return `<div class="phone-topline"><div class="phone-title">聯絡人</div><button class="phone-topbtn" onclick="toast('聯絡人資料為唯讀')">＋</button></div><div class="phone-search" onclick="phoneTab('search')">⌕　搜尋聯絡人</div><div class="phone-list">${names.map(n=>`<button class="phone-callrow" onclick="phoneContact('${n}')">${phoneAvatar(n)}<span class="phone-row-main"><span class="phone-row-name">${n}</span><span class="phone-row-sub">行動電話</span></span><span style="color:#aaa;padding-right:12px">›</span></button>`).join('')}</div>`;
 }
 if(tab==='keypad'){
  return `<div class="phone-topline"><div class="phone-title">鍵盤</div><span></span></div><div class="phone-key-display" id="phone-number"></div><div class="phone-keypad">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].map(([n,l])=>`<button class="phone-key" onclick="phonePress('${n}')">${n}<small>${l}</small></button>`).join('')}</div><div class="phone-dial-actions"><span style="width:58px"></span><button class="phone-call-btn" onclick="toast('此模擬手機不提供主動撥出功能')">☎</button><button class="phone-backspace" onclick="phoneDelete()">⌫</button></div><p class="phone-empty">可輸入號碼；此遊戲僅模擬介面，不會撥出真實電話</p>`;
 }
 return `<div class="phone-topline"><div class="phone-title">搜尋</div></div><input class="phone-search-input" placeholder="姓名或電話號碼" oninput="phoneSearch(this.value)"><div id="phone-search-results" class="phone-list" style="margin-top:14px">${['성민이','매니저님','박세림','정모형','원진형','형준형','민희형','우빈형'].map(n=>`<button class="phone-callrow" onclick="phoneContact('${n}')">${phoneAvatar(n)}<span class="phone-row-main"><span class="phone-row-name">${n}</span><span class="phone-row-sub">聯絡人</span></span></button>`).join('')}</div>`;
}

function addKoreanTranslations(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    if(node.parentElement && node.parentElement.closest('.kt-wrap'))return;
    const raw=node.nodeValue, key=raw.trim();
    if(!key || !/[가-힣]/.test(key) || !ZH_KO[key])return;
    if(node.parentElement && (node.parentElement.closest('.translation') || node.parentElement.dataset.translated==='1'))return;
    const frag=document.createDocumentFragment();
    const original=document.createElement('span');original.textContent=raw;original.dataset.translated='1';
    const zh=document.createElement('div');zh.className='translation';zh.textContent=ZH_KO[key];
    frag.append(original,zh);node.parentNode.replaceChild(frag,node);
  });
}

const baseRenderApp=renderApp;

  state.app=id;

  enhanceApp(id);

};
function enhanceApp(id){
  const root=el('appbody-content');
  if(!root)return;
  root.querySelectorAll('.item').forEach((node,i)=>{
    if(node.dataset.detailBound)return;
    node.dataset.detailBound='1';node.style.cursor='pointer';
    node.addEventListener('click',e=>{
      e.stopPropagation();
      if(e.target.closest('button'))return;
      const text=node.innerText.trim();
      detailPage('詳細資訊',`<div class="card"><p style="white-space:pre-line">${escHtml(text)}</p><p class="muted small">此項目為手機內的唯讀紀錄。</p></div>`,()=>renderApp(id));
    });
  });
  root.querySelectorAll('.photo').forEach((node,i)=>{
    if(node.dataset.photoBound)return;node.dataset.photoBound='1';node.style.cursor='pointer';
    node.addEventListener('click',()=>detailPage('照片預覽',`<div class="photo" style="height:260px;aspect-ratio:auto;justify-content:center;align-items:center;font-size:16px">${escHtml(node.innerText)}<br><small>示意素材，非真實照片</small></div><p class="muted small">此版本尚未匯入實際照片素材。</p>`,()=>renderApp(id)));
  });
  if(['instagram','x','berriz','melon','game','taxi','notes','clock','translate','weather','settings','phone','messages'].includes(id)){
    root.querySelectorAll('.card').forEach((node,i)=>{
      if(node.dataset.detailBound || node.querySelector('button'))return;
      node.dataset.detailBound='1';node.style.cursor='pointer';
      node.addEventListener('click',e=>{
        if(e.target.closest('button'))return;
        detailPage('詳細紀錄',`<div class="card"><p style="white-space:pre-line">${escHtml(node.innerText.trim())}</p><p class="muted small">遊戲內瀏覽紀錄 · 唯讀</p></div>`,()=>renderApp(id));
      });
    });
  }
  if(id==='calendar' && !root.querySelector('[data-finish-day]')){
    const btn=document.createElement('button');btn.className='action';btn.dataset.finishDay='1';btn.style.width='100%';btn.style.margin='6px 0 14px';btn.textContent=state.day===9?'完成十日企劃／查看回顧':'完成今日行程 · 進入下一天';
    btn.addEventListener('click',()=>{finishDay();save();updateClock();});root.prepend(btn);
  }
  if(id==='phone' && !root.querySelector('[data-call-demo]')){
    const btn=document.createElement('button');btn.className='action';btn.dataset.callDemo='1';btn.style.width='100%';btn.textContent='模擬接收來電';
    btn.onclick=()=>incomingCall();root.prepend(btn);
  }
  if(id==='photos'){
    const note=document.createElement('div');note.className='card small';note.innerHTML='<b>相簿說明</b><p class="muted">目前為可點擊的照片分類佔位畫面；未匯入的照片不會假裝成真實公開照片。</p>';root.prepend(note);
  }
}

function renderKakaoList(){
  state.app='kakao';
  const replies=state.chatReplies||{};
  const rows=chatNames.map((name,i)=>{
    const data=chatData[name]||[];const last=(replies[name]||[]).slice(-1)[0]||data[data.length-1];
    const preview=last?(last.sender==='김태영'?'나: ':'')+last[2]: '새로운 대화';
    const time=last?last[0].split(' ').slice(-1)[0]:'';

  }).join('');
  header('KakaoTalk',`<div class="kt-wrap"><div class="kt-top"><span>채팅</span><span class="kt-top-actions">⌕　＋　☰</span></div><div class="kt-search">⌕　搜尋聊天</div><div class="kt-list">${rows}</div><div class="kt-tabs"><span><b>●</b>朋友</span><span><b>▣</b>聊天</span><span><b>◉</b>開放聊天</span><span><b>◷</b>動態</span><span><b>⋯</b>更多</span></div></div>`);
  el('appbody').style.padding='0';
}
function openChat(name){
  state.selectedChat=name;state.chatReplies=state.chatReplies||{};
  const rows=[...(chatData[name]||[]),...(state.chatReplies[name]||[])];
  let lastDate='';
  const messages=rows.map(r=>{
    const date=(r[0]||'').split(' ')[0];let divider='';
    if(date!==lastDate){divider=`<div class="kt-day">${date.includes('/')?'2026年'+date.replace('/','月')+'日':date}</div>`;lastDate=date;}
    const mine=r[1]==='김태영';const zh=ZH_KO[r[2]]||'（中文翻譯暫缺）';
    return divider+`<div class="kt-msg ${mine?'mine':''}">${mine?'':ktIncomingAvatar(r[1]||name)}<div class="kt-msg-content">${!mine&&name.includes('단체')?`<div class="kt-sender">${escHtml(r[1])}</div>`:''}<div class="kt-bubbleline">${mine?`<span class="kt-time">${escHtml((r[0]||'').split(' ')[1]||'')}</span>`:''}<div class="kt-bubble">${escHtml(r[2])}<div class="kt-translation">${escHtml(zh)}</div></div>${mine?'':`<span class="kt-time">${escHtml((r[0]||'').split(' ')[1]||'')}</span>`}</div></div></div>`;
  }).join('');
  const options=[['알겠어 ㅋㅋ','知道啦ㅋㅋ'],['응 조금 있다가 봐!','嗯，等一下見！'],['지금은 조금 바빠. 나중에 연락할게.','我現在有點忙，晚點聯絡你。']];
  const controls=name==='매니저님'?'<div class="kt-readonly">工作聊天室 · 可瀏覽紀錄</div>':`<div class="kt-compose"><div class="kt-compose-label">選擇快速回覆 · 不開放自由輸入</div>${options.map((o,i)=>`<button class="kt-reply" onclick="replyChoice(${i})">${o[0]}<div class="kt-translation">${o[1]}</div></button>`).join('')}</div>`;
  header('KakaoTalk',`<div class="kt-room"><div class="kt-roomhead"><button onclick="renderKakaoList()">‹</button><div class="kt-roomtitle">${escHtml(name)}</div><div class="kt-roomtools">⌕　☰</div></div><div class="kt-messages" id="kt-messages">${messages||'<div class="kt-day">最近一週</div>'}</div>${controls}</div>`);
  el('appbody').style.padding='0';
  el('appback').onclick=()=>renderKakaoList();
  requestAnimationFrame(()=>{const box=el('kt-messages');if(box)box.scrollTop=box.scrollHeight;});
}

/* ===== Automatic Day 1 main-task recognition ===== */
(function installAutomaticMainTaskRecognition(){
  function reconcileMainTasks(){
    if(!window.state && typeof state==='undefined') return;
    state.day1Replies=state.day1Replies||{};
    state.day1Done=state.day1Done||{};
    state.bubbleViewed=state.bubbleViewed||{};
    // Derive completion from the actual player actions, not from Mission-app buttons.
    if([0,1,2].every(i=>!!state.day1Replies[i])) state.day1Done.t1=true;
    if(state.day1Done.t2===true) state.day1Done.t2=true;
    if(state.day1Done.t3===true) state.day1Done.t3=true;
    if(state.xBlocked===true && state.managerReported===true) state.day1Done.t4=true;
    if(state.bubbleViewed.seongNight===true) state.day1Done.t5=true;
    const done=[state.day1Done.t1,state.day1Done.t2,state.day1Done.t3,state.day1Done.t4,state.day1Done.t5];
    let progress=0;
    while(progress<done.length && done[progress]) progress++;
    const changed=state.mainTask!==progress;
    state.mainTask=progress;
    if(progress===5){
      state.storyStep='free';
      state.day1Done.all=true;
    }
    if(typeof saveNew==='function') saveNew();
    // If the player is currently viewing Mission, update it immediately.
    if(changed && state.app==='mission' && typeof renderApp==='function') renderApp('mission');
    return progress;
  }
  window.reconcileMainTasks=reconcileMainTasks;
  const wrap=(name)=>{
    const original=window[name];
    if(typeof original!=='function' || original.__autoTaskWrapped) return;
    const wrapped=function(...args){
      const result=original.apply(this,args);
      reconcileMainTasks();
      return result;
    };
    wrapped.__autoTaskWrapped=true;
    window[name]=wrapped;
  };
  ['sendMorningReply','completeSchedule','finishPractice','blockSuspicious','sendReportFirst','sendReportSecond','finishReport','viewSeongBubble'].forEach(wrap);
  // Also repair progress from saved games on load/reload.
  reconcileMainTasks();
})();

      '태영아 오늘 안무 영상 봤어?':'太榮啊，今天的編舞影片看了嗎？','네 형! 마지막 부분이 조금 어려워요':'嗯哥！最後一個部分有點難。','그 부분은 박자보다 동선 먼저 생각해 봐.':'那個部分先想好走位，再抓節拍看看。','오 그렇게 해볼게요!':'喔！我試試看這樣做！','좋아 ㅎㅎ 내일 같이 맞춰 보자.':'好ㅎㅎ 明天一起練習看看。',
      '김태영 뭐 해ㅋㅋ':'金太榮在幹嘛ㅋㅋ','그냥 누워 있어요 형':'我只是在躺著，哥。','또 누워 있어? ㅋㅋㅋ':'又在躺著？ㅋㅋㅋ','내일 연습 끝나고 뭐 먹을래?':'明天練習結束後想吃什麼？','형이 사주는 거예요?':'哥要請客嗎？','아 ㅋㅋㅋ 메뉴나 골라':'啊ㅋㅋㅋ 先選菜單啦。',
      '태영아 내 충전기 혹시 봤어?':'太榮啊，你有看到我的充電器嗎？','형 방에 있는 거 아니에요?':'不是在哥房間裡嗎？','없는데...':'沒有欸……','아까 소파 옆에서 본 것 같은데요':'我好像剛才在沙發旁邊看到。','찾았다 ㅋㅋ 고마워':'找到了ㅋㅋ 謝啦。',
      '태영아 오늘 사진 찍은 거 봤어?':'太榮啊，今天拍的照片看了嗎？','아직 안 봤어요 형 ㅋㅋ':'還沒看呢哥ㅋㅋ','너 잘 나왔던데? 나중에 보내줄게!':'你拍得很好看欸？晚點傳給你！','진짜요? 감사합니다 ㅎㅎ':'真的嗎？謝謝哥ㅎㅎ','내일도 같이 사진 찍자~':'明天也一起拍照吧～'
    })[r[2]]||'聊天紀錄',(r[0]||'').split(' ')[1]||'')).join('')}</div><div class="kt-readonly">읽기 전용 · 僅供查看，無法回覆</div></div>`;
  }
  function openDay1Chat(name){
    if(readOnlyNames.includes(name)){header('KakaoTalk',readonlyChatMarkup(name));$('appbody').style.padding='0';$('appback').onclick=renderKakaoListFinal;return;}
    if(name==='성민이' && state.mainTask<1){renderMorningChat();return;}
    if(name==='매니저님' && state.storyStep==='schedule' && state.mainTask<2){renderScheduleChat();return;}
    if(name==='매니저님' && state.storyStep==='report' && state.mainTask<4){renderReportChat(0);return;}
    if(name==='정모형'||name==='우빈형'){renderInteractiveExtraChat(name);return;}
    if(name==='매니저님'){
      const rows=[['11/02 09:10','오늘 일정 보내줄게.','今天的行程傳給你。'],['11/02 16:15','확인했어. 당분간 조심해.','知道了，這段時間先小心。']];
      renderReadonlyGeneric(name,rows);return;
    }
    if(name==='성민이'){
      const rows=[['11/02 08:50','태영아 일어났어?','太榮啊，起床了嗎？'],['11/02 08:51','오늘 연습 잘 하고 와','今天練習加油！'],['11/02 08:52','오늘 저녁에 같이 밥 먹을래?','今天晚上要不要一起吃飯？']];
      renderReadonlyGeneric(name,rows);return;
    }
  }
  window.openDay1Chat=openDay1Chat;
  function renderReadonlyGeneric(name,rows){header('KakaoTalk',`<div class="kt-room">${chatHeader(name)}<div class="kt-messages">${rows.map(r=>chatMessage(name,r[1],r[2])).join('')}</div><div class="kt-readonly">對話紀錄 · 唯讀</div></div>`);$('appbody').style.padding='0';$('appback').onclick=renderKakaoListFinal;}
  function renderInteractiveExtraChat(name){
    state.extraChatState=state.extraChatState||{};const idx=state.extraChatState[name]||0;const script=extraChatScripts[name];
    const shown=script.slice(0,Math.min(idx+1,script.length));
    const body=shown.map(m=>chatMessage(m.from,m.ko,m.zh)).join('');
    let controls='';const current=script[idx];
    if(current && current.from!== '김태영' && current.options){controls=`<div class="kt-compose"><div class="kt-compose-label">選擇回覆</div>${current.options.map((o,j)=>`<button class="kt-reply" onclick="replyExtraMember('${name}',${j})">${escHtml(o)}<div class="kt-translation">點擊傳送</div></button>`).join('')}</div>`;}
    else if(idx>=script.length-1)controls='<div class="kt-readonly">對話已結束 · 可以返回聊天列表</div>';
    header('KakaoTalk',`<div class="kt-room">${chatHeader(name)}<div class="kt-messages" id="kt-messages">${body}</div>${controls}</div>`);$('appbody').style.padding='0';$('appback').onclick=renderKakaoListFinal;
    requestAnimationFrame(()=>{const b=$('kt-messages');if(b)b.scrollTop=b.scrollHeight;});
  }
  window.replyExtraMember=function(name,j){
    const script=extraChatScripts[name],idx=state.extraChatState?.[name]||0,current=script[idx];if(!current||!current.options)return;
    const ko=current.options[j];const zh=name==='정모형'?['在宿舍休息。','哥在做什麼？','只是在聽音樂。'][j]:['還沒吃。','和性珉一起吃了。','哥吃了嗎？'][j];
    script[idx+1]={from:'김태영',ko,zh};state.extraChatState[name]=idx+1;renderInteractiveExtraChat(name);
    showTyping(name,()=>{state.extraChatState[name]=Math.min(idx+2,script.length-1);renderInteractiveExtraChat(name);if(state.extraChatState[name]>=script.length-1){state.extraChats=state.extraChats||[];if(!state.extraChats.includes(name))state.extraChats.push(name);if(state.extraChats.includes('정모형')&&state.extraChats.includes('우빈형'))state.extraDone.chats=true;persist();}});
  };

  renderApp=function(id){
    if(id==='mission'){header('任務',missionMarkup());return;}
    if(id==='settings'){header('Settings',settingsMarkup());return;}
    if(id==='achievements'){originalRenderApp(id);return;}
    if(id==='kakao'){renderKakaoListFinal();return;}
    if(id==='bubble'){renderBubbleHome();return;}
    originalRenderApp(id);
  };
  window.renderApp=renderApp;
  window.openGenericChat=openDay1Chat;

  openStoryTarget=function(step){
    if(!step)return;
    if(step==='kakao1'){state.storyStep='kakao1';openApp('kakao');renderMorningChat();}
    else if(step==='taeMorning'||step==='taeNoon'||step==='taeNight'){openApp('bubble');openStoryBubble('tae',step);}
    else if(step==='seongMorning'||step==='seongNight'){openApp('bubble');openStoryBubble('seong',step);}
    else if(step==='schedule'){state.storyStep='schedule';openApp('kakao');renderScheduleChat();}
    else if(step==='practice'){state.storyStep='practice';openApp('kakao');renderPractice();}
    else if(step==='xIncident'){state.storyStep='xIncident';openApp('x');renderApp('x');}
    else if(step==='report'){state.storyStep='report';openApp('kakao');renderReportChat(0);}
  };
  window.openStoryTarget=openStoryTarget;

  window.blockSuspicious=function(){
    state.xBlocked=true;state.day1Done.t4block=true;state.storyStep='report';persist();openApp('kakao');renderReportChat(0);
  };
  window.viewXPost=function(i){
    state.xViewed=state.xViewed||[];if(!state.xViewed.includes(i))state.xViewed.push(i);
    if(state.mainTask>=5&&state.xViewed.length>=10)state.extraDone.x10=true;
    const suspicious=i===2;const post=suspicious?'오늘 연습 일정도 이미 알고 있지ㅋㅋ':'오늘도 CRAVITY 응원해요!';const zh=suspicious?'今天的練習行程我也早就知道了ㅋㅋ':'今天也支持 CRAVITY！';
    header('X 貼文',`<div class="card"><b>@${suspicious?'unknown_091':'luvity_daily'}</b><p>${post}</p><p class="story-zh">${zh}</p>${suspicious?'<button class="action danger" onclick="blockSuspicious()">封鎖帳號</button>':''}</div>`);persist();
  };
  if(typeof originalViewXPost==='function'){};

  const oldOpenBubble=window.openBubble;
  window.openBubble=function(which){if(state.mainTask>=5){openBubbleArchive(which);return;}return oldOpenBubble(which);};
  window.openStoryTarget=openStoryTarget;
  window.finishDay=function(){toast('Day 2 的主線劇情尚未設定，暫時不能進入下一天');};
  advance=function(min){if(state.gamePaused||state.mainTask>=5)return;state.minute+=min;updateClock();persist();};
  window.advance=advance;
  window.confirmCheckout=function(kind,total){
    if(typeof originalConfirmCheckout==='function')originalConfirmCheckout(kind,total);
    if(kind==='shop')state.achievements=(state.achievements||[]).filter(a=>a!=='首次消費超過 ₩50,000');
    persist();
  };
  window.musicOpen=function(index){const song=melonPlaylist[index];if(!song)return;const opened=window.open(song.url,'_blank','noopener');if(!opened){toast('YouTube 開啟遭到瀏覽器阻擋，請允許彈出視窗後再試一次');return;}if(state.mainTask>=5){state.extraDone.music=true;state.achievements=state.achievements||[];if(!state.achievements.includes('音樂探索者'))state.achievements.push('音樂探索者');persist();}toast('正在開啟 YouTube：'+song.name);};

  // Remove any pre-existing future notifications: events are created only as the story reaches them.
  if(!state.day1Started){state.notifications=[];}
  if(state.mainTask>=5){state.gamePaused=true;state.bubbleHistoryUnlocked=true;}
  initDayOne();
})();

</script>
